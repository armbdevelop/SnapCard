services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    environment:
      - SNAPCARD_DEBUG=true
      - SNAPCARD_DATABASE_URL=sqlite+aiosqlite:///./snapcard.db
      - SNAPCARD_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
